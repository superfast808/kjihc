services:
  db:
    image: postgres:16
    container_name: kjihc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kjihc}
      POSTGRES_USER: ${POSTGRES_USER:-kjihc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kjihc_pgdata:/var/lib/postgresql/data
    networks:
      - kjihc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kjihc} -d ${POSTGRES_DB:-kjihc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: kjihc-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - kjihc

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-/api/__clerk}
        BASE_PATH: ${BASE_PATH:-/}
    container_name: kjihc-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${KJIHC_PORT:-8094}:80"
    networks:
      - kjihc

networks:
  kjihc:
    driver: bridge

volumes:
  kjihc_pgdata:
