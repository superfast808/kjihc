kind = "mobile"
previewPath = "/kjihc-mobile/"
title = "KJIHC Mobile"
description = "A companion mobile app for Kilmarnock Junior Ice Hockey Club. Staff and coaches can mark attendance, view player profiles with medical alerts, and manage sessions from the ice rink. Parents can request a magic link and view or update their child's details. Shares the same API and database as the main club management web app."
version = "1.0.0"
id = "artifacts/kjihc-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/kjihc-mobile/" ]
localPort = 23382

[services.development]
run = "pnpm --filter @workspace/kjihc-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kjihc-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kjihc-mobile", "run", "serve" ]

[services.env]
PORT = "23382"
BASE_PATH = "/kjihc-mobile/"
