services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: kjihc-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    networks:
      - kjihc

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-/api/__clerk}
        BASE_PATH: ${BASE_PATH:-/}
    container_name: kjihc-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${KJIHC_PORT:-8093}:80"
    networks:
      - kjihc

networks:
  kjihc:
    driver: bridge
